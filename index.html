<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meridian Sync — Remote Team Time-Zone &amp; Overlap Planner</title>
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/main.css">
  <script defer src="js/zones.js"></script>
  <script defer src="js/app.js"></script>
</head>
<body>
  <div class="atlas-wrap">
    <header class="topbar">
      <div class="brand">
        <div class="brand-globe" aria-hidden="true">UTC</div>
        <div>
          <h1>Meridian Sync</h1>
          <p>Real IANA timezone scrubber, DST-aware overlap scorer &amp; multi-zone invite generator</p>
        </div>
      </div>

      <div class="topbar-controls">
        <button type="button" class="btn" id="formatToggleBtn">24h Format</button>
        <button type="button" class="btn" id="resetTeamBtn">Reset Team</button>
        <button type="button" class="btn btn-primary" id="copyInviteBtn">Copy Invite Summary</button>
      </div>
    </header>

    <section class="planner-bar" aria-label="Meeting configuration">
      <div class="field">
        <label for="meetingTitleInput">Meeting Title</label>
        <input type="text" id="meetingTitleInput" value="Weekly Architecture Sync">
      </div>
      <div class="field">
        <label for="dateInput">Meeting Date</label>
        <input type="date" id="dateInput">
      </div>
      <div class="field">
        <label for="refZoneSelect">Reference Axis Timezone</label>
        <select id="refZoneSelect"></select>
      </div>
      <div class="field">
        <label for="durationSelect">Duration</label>
        <select id="durationSelect">
          <option value="30">30 minutes</option>
          <option value="60" selected>60 minutes</option>
          <option value="90">90 minutes</option>
          <option value="120">120 minutes</option>
        </select>
      </div>
    </section>

    <section class="overlap-card" aria-label="Selected slot overlap score and best windows">
      <div class="overlap-summary">
        <div class="overlap-score" id="overlapScore">--</div>
        <div class="overlap-detail" id="overlapDetail">--</div>
      </div>

      <div class="best-slots" id="bestSlots" aria-label="Top recommended meeting windows"></div>
    </section>

    <section class="timeline-card" aria-label="24-hour synchronized team timeline">
      <div class="scrubber-row">
        <label for="hourSlider" style="font-weight:700;font-size:13px;">Scrub Window:</label>
        <input type="range" id="hourSlider" min="0" max="47" step="1" value="18">
        <span id="selectedAxisReadout" style="font-family:var(--font-mono);font-weight:700;font-size:13px;color:var(--accent);">--</span>
      </div>

      <div class="timeline-scroll">
        <div class="timeline-grid" id="timelineGrid"></div>
      </div>

      <div class="legend-bar">
        <div class="legend-items">
          <span class="legend-chip"><span class="dot-box" style="background:var(--band-work-bg);border:1px solid #6ee7b7;"></span>Core Work (09:00&ndash;17:59)</span>
          <span class="legend-chip"><span class="dot-box" style="background:var(--band-flex-bg);border:1px solid #fcd34d;"></span>Flexible (07:00&ndash;08:59, 18:00&ndash;20:59)</span>
          <span class="legend-chip"><span class="dot-box" style="background:var(--band-sleep-bg);border:1px solid #cbd5e1;"></span>Off Hours / Sleep</span>
        </div>
        <span>Click any hour column above to snap meeting time</span>
      </div>
    </section>

    <section class="add-card" aria-label="Add teammate to timeline">
      <form class="add-form" id="addMemberForm">
        <div class="field">
          <label for="memberNameInput">Teammate Name</label>
          <input type="text" id="memberNameInput" placeholder="e.g. Elena R." required>
        </div>
        <div class="field">
          <label for="memberRoleInput">Role / Squad</label>
          <input type="text" id="memberRoleInput" placeholder="e.g. Platform Lead">
        </div>
        <div class="field">
          <label for="memberZoneSelect">City / Timezone</label>
          <select id="memberZoneSelect"></select>
        </div>
        <button type="submit" class="btn btn-primary">Add Teammate</button>
      </form>
    </section>
  </div>

  <div class="toast" id="toast" hidden role="status" aria-live="polite"></div>
</body>
</html>
